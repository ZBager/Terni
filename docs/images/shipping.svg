<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 384" role="img" aria-label="Compile the rules once; players' machines only load SPIR-V">
  <title>Compile the rules once; players' machines only load SPIR-V</title>
  <style>
    text { font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
    .title { font-size: 15px; font-weight: 600; fill: #1f2328; }
    .name { font-size: 13px; font-weight: 600; fill: #1f2328; }
    .body { font-size: 11.5px; fill: #59636e; }
    .box { fill: none; stroke: #8c959f; stroke-width: 1.25; }
    .group { fill: #8c959f; fill-opacity: 0.08; stroke: #8c959f; stroke-width: 1; stroke-dasharray: 4 4; }
    .main { fill: #0969da; fill-opacity: 0.12; stroke: #0969da; stroke-width: 2; }
    .edge { fill: none; stroke: #8c959f; stroke-width: 1.25; }
    .head { fill: #8c959f; }
    @media (prefers-color-scheme: dark) {
      .title, .name { fill: #e6edf3; }
      .body { fill: #9198a1; }
      .box, .edge { stroke: #6e7681; }
      .group { fill: #6e7681; stroke: #6e7681; }
      .head { fill: #6e7681; }
      .main { fill: #4493f8; fill-opacity: 0.15; stroke: #4493f8; }
    }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path class="head" d="M0 0L10 5L0 10z"/>
    </marker>
  </defs>
  <text class="title" x="24" y="34">Compile the rules once; players' machines only load SPIR-V</text>
  <rect class="group" x="24" y="56" width="712" height="128" rx="8"/>
  <text class="name" x="40" y="80">On your build machine (or CI)</text>
  <rect class="group" x="24" y="232" width="712" height="128" rx="8"/>
  <text class="name" x="40" y="256">On the player's machine</text>
  <g class="edge">
    <path d="M240 132H270" marker-end="url(#arrow)"/>
    <path d="M488 132H518" marker-end="url(#arrow)"/>
    <path d="M620 168V270" marker-end="url(#arrow)"/>
    <path d="M520 308H490" marker-end="url(#arrow)"/>
    <path d="M272 308H242" marker-end="url(#arrow)"/>
  </g>
  <text class="body" x="632" y="216">shipped with the game</text>
  <rect class="box" x="40" y="96" width="200" height="72" rx="8"/>
  <text class="name" x="56" y="120">Game data folder</text>
  <text class="body" x="56" y="138">schema, common, history,</text>
  <text class="body" x="56" y="154">rules/*.glsl</text>
  <rect class="box" x="272" y="96" width="216" height="72" rx="8"/>
  <text class="name" x="288" y="120">compile_rules()</text>
  <text class="body" x="288" y="138">Terni::core with shaderc,</text>
  <text class="body" x="288" y="154">no GPU needed</text>
  <rect class="box" x="520" y="96" width="200" height="72" rx="8"/>
  <text class="name" x="536" y="120">SPIR-V cache</text>
  <text class="body" x="536" y="138">one file per stage,</text>
  <text class="body" x="536" y="154">keyed by the full source</text>
  <rect class="box" x="520" y="272" width="200" height="56" rx="8"/>
  <text class="name" x="536" y="296">SPIR-V cache</text>
  <text class="body" x="536" y="314">read-only is fine</text>
  <rect class="main" x="272" y="272" width="216" height="72" rx="8"/>
  <text class="name" x="288" y="296">GameSim</text>
  <text class="body" x="288" y="314">Terni::runtime: every rule</text>
  <text class="body" x="288" y="330">comes from the cache</text>
  <rect class="box" x="40" y="272" width="200" height="72" rx="8"/>
  <text class="name" x="56" y="296">Vulkan device</text>
  <text class="body" x="56" y="314">any GPU, or a software</text>
  <text class="body" x="56" y="330">Vulkan driver</text>
</svg>
