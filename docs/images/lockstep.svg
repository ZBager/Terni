<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 400" role="img" aria-label="Every peer runs the same tick from the same commands; only commands travel">
  <title>Every peer runs the same tick from the same commands; only commands travel</title>
  <style>
    text { font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
    .title { font-size: 15px; font-weight: 600; fill: #1f2328; }
    .name { font-size: 13px; font-weight: 600; fill: #1f2328; }
    .body { font-size: 11.5px; fill: #59636e; }
    .box { fill: none; stroke: #8c959f; stroke-width: 1.25; }
    .group { fill: #8c959f; fill-opacity: 0.08; stroke: #8c959f; stroke-width: 1; stroke-dasharray: 4 4; }
    .main { fill: #0969da; fill-opacity: 0.12; stroke: #0969da; stroke-width: 2; }
    .edge { fill: none; stroke: #8c959f; stroke-width: 1.25; }
    .head { fill: #8c959f; }
    @media (prefers-color-scheme: dark) {
      .title, .name { fill: #e6edf3; }
      .body { fill: #9198a1; }
      .box, .edge { stroke: #6e7681; }
      .group { fill: #6e7681; stroke: #6e7681; }
      .head { fill: #6e7681; }
      .main { fill: #4493f8; fill-opacity: 0.15; stroke: #4493f8; }
    }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path class="head" d="M0 0L10 5L0 10z"/>
    </marker>
  </defs>
  <text class="title" x="24" y="34">Every peer runs the same tick from the same commands; only commands travel</text>
  <g class="edge">
    <path d="M224 100H262" marker-end="url(#arrow)"/>
    <path d="M464 100H502" marker-end="url(#arrow)"/>
    <path d="M620 136V182" marker-end="url(#arrow)"/>
    <path d="M504 220H466" marker-end="url(#arrow)"/>
    <path d="M264 220H124V138" marker-end="url(#arrow)"/>
    <path d="M620 256V302" marker-end="url(#arrow)"/>
  </g>
  <text class="body" x="194" y="210" text-anchor="middle">next tick's commands</text>
  <rect class="box" x="24" y="64" width="200" height="72" rx="8"/>
  <text class="name" x="40" y="88">Players and AI</text>
  <text class="body" x="40" y="106">give commands between</text>
  <text class="body" x="40" y="122">ticks, also when paused</text>
  <rect class="box" x="264" y="64" width="200" height="72" rx="8"/>
  <text class="name" x="280" y="88">Host or server</text>
  <text class="body" x="280" y="106">sends one turn per tick</text>
  <text class="body" x="280" y="122">with every command in it</text>
  <rect class="box" x="504" y="64" width="232" height="72" rx="8"/>
  <text class="name" x="520" y="88">Your logic on every peer</text>
  <text class="body" x="520" y="106">applies the commands: paths,</text>
  <text class="body" x="520" y="122">events, modifiers, writes</text>
  <rect class="main" x="504" y="184" width="232" height="72" rx="8"/>
  <text class="name" x="520" y="208">Terni tick</text>
  <text class="body" x="520" y="226">all stages on the GPU,</text>
  <text class="body" x="520" y="242">one submission per tick</text>
  <rect class="box" x="264" y="184" width="200" height="72" rx="8"/>
  <text class="name" x="280" y="208">Results</text>
  <text class="body" x="280" y="226">read_each_tick fields,</text>
  <text class="body" x="280" y="242">same submission</text>
  <rect class="box" x="504" y="304" width="232" height="72" rx="8"/>
  <text class="name" x="520" y="328">Every N ticks</text>
  <text class="body" x="520" y="346">peers compare state hashes;</text>
  <text class="body" x="520" y="362">a mismatch is a desync</text>
</svg>
