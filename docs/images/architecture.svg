<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 488" role="img" aria-label="A world is data until it loads; then GameSim and the GPU own the state">
  <title>A world is data until it loads; then GameSim and the GPU own the state</title>
  <style>
    text { font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
    .title { font-size: 15px; font-weight: 600; fill: #1f2328; }
    .name { font-size: 13px; font-weight: 600; fill: #1f2328; }
    .body { font-size: 11.5px; fill: #59636e; }
    .box { fill: none; stroke: #8c959f; stroke-width: 1.25; }
    .main { fill: #0969da; fill-opacity: 0.12; stroke: #0969da; stroke-width: 2; }
    .edge { fill: none; stroke: #8c959f; stroke-width: 1.25; }
    .head { fill: #8c959f; }
    @media (prefers-color-scheme: dark) {
      .title, .name { fill: #e6edf3; }
      .body { fill: #9198a1; }
      .box, .edge { stroke: #6e7681; }
      .head { fill: #6e7681; }
      .main { fill: #4493f8; fill-opacity: 0.15; stroke: #4493f8; }
    }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path class="head" d="M0 0L10 5L0 10z"/>
    </marker>
  </defs>
  <text class="title" x="24" y="34">A world is data until it loads; then GameSim and the GPU own the state</text>

  <g class="edge">
    <path d="M184 92H230" marker-end="url(#arrow)"/>
    <path d="M452 92H494" marker-end="url(#arrow)"/>
    <path d="M616 120V150" marker-end="url(#arrow)"/>
    <path d="M484 208V238" marker-end="url(#arrow)"/>
    <path d="M184 300H230" marker-end="url(#arrow)"/>
    <path d="M232 332H186" marker-end="url(#arrow)"/>
    <path d="M640 352V398" marker-end="url(#arrow)"/>
  </g>

  <rect class="box" x="24" y="64" width="160" height="392" rx="8"/>
  <text class="name" x="40" y="88">Your engine or game</text>
  <text class="body" x="40" y="108">UI, rendering, sound</text>
  <text class="body" x="40" y="124">events, AI, network</text>
  <text class="body" x="40" y="280">sends commands,</text>
  <text class="body" x="40" y="296">modifiers, writes</text>
  <text class="body" x="40" y="352">reads tick results,</text>
  <text class="body" x="40" y="368">saves, state hashes</text>

  <rect class="box" x="232" y="64" width="220" height="56" rx="8"/>
  <text class="name" x="248" y="88">Game data folder</text>
  <text class="body" x="248" y="106">schema, common, history, rules</text>

  <rect class="box" x="496" y="64" width="240" height="56" rx="8"/>
  <text class="name" x="512" y="88">load_game or WorldBuilder</text>
  <text class="body" x="512" y="106">validation, order warnings</text>

  <rect class="box" x="232" y="152" width="504" height="56" rx="8"/>
  <text class="name" x="248" y="176">Game</text>
  <text class="body" x="248" y="194">entities, fields, defines, modifier keys, stages, starting state</text>

  <rect class="main" x="232" y="240" width="504" height="128" rx="8"/>
  <text class="name" x="248" y="264">GameSim</text>
  <rect class="box" x="248" y="280" width="144" height="72" rx="8"/>
  <text class="name" x="260" y="304">Rule compiler</text>
  <text class="body" x="260" y="322">prelude + shaderc</text>
  <text class="body" x="260" y="338">SPIR-V cache</text>
  <rect class="box" x="408" y="280" width="144" height="72" rx="8"/>
  <text class="name" x="420" y="304">Modifier store</text>
  <text class="body" x="420" y="322">exact totals,</text>
  <text class="body" x="420" y="338">expiry queue</text>
  <rect class="box" x="568" y="280" width="144" height="72" rx="8"/>
  <text class="name" x="580" y="304">ComputeRunner</text>
  <text class="body" x="580" y="322">one command</text>
  <text class="body" x="580" y="338">buffer per tick</text>

  <rect class="box" x="232" y="400" width="504" height="56" rx="8"/>
  <text class="name" x="248" y="424">Vulkan device (any GPU, or lavapipe on the CPU)</text>
  <text class="body" x="248" y="442">one buffer per field; every stage is a compute shader</text>
</svg>
