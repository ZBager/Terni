name: GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - 'docs/images/branding/terni-hero-icon.png'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/configure-pages@v5
      - name: Prepare static site
        run: |
          mkdir -p _site/assets
          cp site/index.html site/style.css site/benchmark.js _site/
          cp docs/images/branding/terni-hero-icon.png _site/assets/
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site
      - uses: actions/deploy-pages@v4
        id: deployment
